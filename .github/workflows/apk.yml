name: Construire l'APK LexNav

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk LexNav.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LexNav-apk
          path: LexNav.apk

      - name: Publier la version (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LexNav Android 1.0.${{ github.run_number }}
          body: "Télécharge **LexNav.apk** ci-dessous et installe-le sur ton Samsung."
          files: LexNav.apk
